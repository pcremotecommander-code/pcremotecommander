name: Source checks

on:
  push:
    branches: [main, next, release/beta49-single-assistant-rc1]
  pull_request:
    branches: [main, next, release/beta49-stable]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      PCRC_SOURCE_ONLY_TESTS: '1'
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check source credentials and whitespace
        run: |
          python scripts/check_source_credentials.py
          git diff --check
      - name: Install source dependencies
        run: |
          python -m pip install -e ".[dev,browser]"
          npm ci --prefix deploy/cloudflare/worker
          npm ci --prefix deploy/mcp-task-server
          npm ci --prefix deploy/npm/jan-commander
      - name: Install Linux browser and required libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Python source suite (Linux)
        if: runner.os == 'Linux'
        env:
          JAN_MCP_BROWSER_CHANNEL: chromium
        run: python -m pytest -q -ra
      - name: Warm Windows PowerShell for command tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -c "import os, subprocess; from jan_mcp_commander.environment import runtime_environment; subprocess.run([os.path.join(os.environ['SystemRoot'], 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe'), '-NoProfile', '-NonInteractive', '-Command', 'Write-Output PCRC_CI_POWERSHELL_READY'], env=runtime_environment(), check=True, timeout=90)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python source tests (Windows, no native Defender dependency)
        if: runner.os == 'Windows'
        run: >-
          python -m pytest -q -ra
          tests/test_windows_input.py tests/test_windows_uia.py
          tests/test_security_scan.py tests/test_privacy.py
          tests/test_command_environment.py
      - name: Gateway type check
        run: npm run check --prefix deploy/cloudflare/worker
      - name: Gateway integration suite (Linux)
        if: runner.os == 'Linux'
        env:
          JAN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm test --prefix deploy/cloudflare/worker
      - name: Launcher tests
        run: node --test deploy/npm/launcher/tests/*.test.cjs
      - name: Build MCP test client
        run: npm run build --prefix deploy/mcp-task-server
      - name: MCP bridge and catalog unit tests
        env:
          JAN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node --test deploy/mcp-task-server/dist/bridge.test.js deploy/mcp-task-server/dist/catalog.test.js
      - name: MCP task coordination integration tests (Linux)
        if: runner.os == 'Linux'
        env:
          JAN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node --test deploy/mcp-task-server/dist/coordination.test.js

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
