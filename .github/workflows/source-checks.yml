name: Source checks

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      PCRC_SOURCE_ONLY_TESTS: '1'
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check source credentials and whitespace
        run: |
          python scripts/check_source_credentials.py
          git diff --check
      - name: Install source dependencies
        run: |
          python -m pip install -e ".[dev,browser]"
          npm ci --prefix deploy/cloudflare/worker
          npm ci --prefix deploy/mcp-task-server
          npm ci --prefix deploy/npm/jan-commander
      - name: Install Linux browser and required libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Windows synthetic browser
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Warm and verify Windows security prerequisite
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output PCRC_CI_POWERSHELL_READY
          Set-MpPreference -DisableRealtimeMonitoring $false
          if (-not (Get-MpComputerStatus).RealTimeProtectionEnabled) { throw 'Hosted runner cannot provide required Defender protection' }
          Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureAge | ConvertTo-Json -Compress
          python -c "import os, subprocess; from jan_mcp_commander.environment import runtime_environment; subprocess.run([os.environ['SystemRoot'] + '/System32/WindowsPowerShell/v1.0/powershell.exe', '-NoProfile', '-NonInteractive', '-Command', 'Write-Output PCRC_CI_SANITIZED_ENV_READY'], env=runtime_environment(), check=True, timeout=90)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from jan_mcp_commander.security_scan import scan_bytes; print(scan_bytes(b'PCRC CI synthetic fixture')['result'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python tests
        env:
          JAN_MCP_BROWSER_CHANNEL: chromium
        run: python -m pytest -q -ra
      - name: Gateway types and tests (includes dry-run build)
        env:
          JAN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          npm run check --prefix deploy/cloudflare/worker
          npm test --prefix deploy/cloudflare/worker
      - name: Launcher tests
        run: node --test deploy/npm/launcher/tests/*.test.cjs
      - name: Build MCP test client
        run: npm run build --prefix deploy/mcp-task-server
      - name: MCP bridge and catalog unit tests (Linux)
        if: runner.os == 'Linux'
        env:
          JAN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          JAN_MCP_BROWSER_CHANNEL: chromium
        run: node --test deploy/mcp-task-server/dist/bridge.test.js deploy/mcp-task-server/dist/catalog.test.js
      - name: MCP integration tests (Windows)
        if: runner.os == 'Windows'
        env:
          JAN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          JAN_MCP_BROWSER_CHANNEL: chromium
        run: node --test --test-concurrency=1 'deploy/mcp-task-server/dist/**/*.test.js'
