name: Resource and recovery tests

on:
  push:
    branches: [work/full-concurrency-upgrade]
    paths:
      - "src/jan_mcp_commander/security.py"
      - "src/jan_mcp_commander/coordination.py"
      - "src/jan_mcp_commander/core.py"
      - "src/jan_mcp_commander/control.py"
      - "src/jan_mcp_commander/development.py"
      - "tests/test_security.py"
      - "tests/test_coordination.py"
      - "tests/test_development.py"
      - "tests/test_browser_teaching.py"
      - ".github/workflows/resource-lock-tests.yml"
  pull_request:
    paths:
      - "src/jan_mcp_commander/security.py"
      - "src/jan_mcp_commander/coordination.py"
      - "src/jan_mcp_commander/core.py"
      - "src/jan_mcp_commander/control.py"
      - "src/jan_mcp_commander/development.py"
      - "tests/test_security.py"
      - "tests/test_coordination.py"
      - "tests/test_development.py"
      - "tests/test_browser_teaching.py"
      - ".github/workflows/resource-lock-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-lock-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resource-locks:
    name: Resource and recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run resource-lock and recovery regression tests
        run: |
          python -m pytest -q -ra tests/test_security.py -k "resource_lock"
          python -m pytest -q -ra tests/test_coordination.py
          python -m pytest -q -ra tests/test_development.py
          python -m pytest -q -ra tests/test_browser_teaching.py
