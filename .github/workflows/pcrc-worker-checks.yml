name: PCRC Worker Checks

on:
  pull_request:
    branches:
      - next
    paths:
      - "deploy/cloudflare/worker/**"
      - ".github/workflows/pcrc-worker-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcrc-worker-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Type-check and test Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/cloudflare/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Install launcher test dependencies
        run: npm ci
        working-directory: deploy/npm/jan-commander

      - name: Build and run tests
        run: npm test
        env:
          PCRC_SOURCE_ONLY_TESTS: '1'
