version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/deploy/cloudflare/worker"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/deploy/mcp-task-server"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/deploy/npm/jan-commander"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
